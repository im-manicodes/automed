name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/flotuz/automed
  NODE_IMAGE: mirror.gcr.io/library/node:22-slim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Buildkit desde ECR Public y base node desde el mirror de Google: evita los timeouts de Docker Hub.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildkit-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # Prueba de humo: construye la imagen en local y comprueba su contenido (no arranca la API: migra al iniciar).
      - name: Construir para la prueba de humo
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: NODE_IMAGE=${{ env.NODE_IMAGE }}
          load: true
          tags: automed:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo
        run: |
          docker run --rm --entrypoint ls automed:smoke dist/main.js /app/frontend/index.html
          docker run --rm --entrypoint ls automed:smoke node_modules/.bin/prisma node_modules/.bin/tsx prisma/schema.prisma prisma.config.ts
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: NODE_IMAGE=${{ env.NODE_IMAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redespliega en Dokploy solo tras publicar la imagen en GHCR (si no, bajaría el `latest` anterior).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          test -n "$DOKPLOY_WEBHOOK_URL" || { echo "Falta el secreto DOKPLOY_WEBHOOK_URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --max-time 30 -X POST "$DOKPLOY_WEBHOOK_URL" -o /dev/null
