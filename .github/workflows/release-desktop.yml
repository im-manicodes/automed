name: Release instalable de escritorio

# Construye el instalable (Linux: AppImage + deb; Windows: NSIS .exe), pasa la prueba de humo
# y deja una release EN BORRADOR con los archivos. El workflow Docker/Dokku (deploy.yml) no se toca.
# No usa más secretos que el GITHUB_TOKEN. Sin firma de código: Windows mostrará SmartScreen.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Un build por ref: si se vuelve a lanzar para la misma ref, cancela el que estaba corriendo.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            dist: desktop:dist:linux
          - name: windows
            os: windows-latest
            dist: desktop:dist:win
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" del package.json raíz (pnpm 11).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # xvfb para poder abrir Electron sin pantalla en la prueba de humo.
      - name: Install xvfb (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build installer
        shell: bash
        run: pnpm ${{ matrix.dist }}

      # apps/desktop/scripts/smoke.mjs: carpeta de datos temporal (AUTOMED_DATA_DIR) y --smoke-test;
      # en Linux usa xvfb-run -a ... --no-sandbox; en Windows ejecuta win-unpacked/auto-med.exe.
      # El instalador NO se ejecuta: solo la app ya desempaquetada.
      - name: Smoke test (app desempaquetada)
        shell: bash
        run: pnpm desktop:smoke

      - name: Upload artifacts (Linux)
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Crear release en borrador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # crear la release y subir los archivos
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List files
        run: ls -lh dist-release

      # Con un tag v* usa ese tag; en ejecución manual crea un borrador "manual-<n>".
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: auto-med ${{ github.ref_name }}
          files: dist-release/*
          fail_on_unmatched_files: true
