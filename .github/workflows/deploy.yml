name: Deploy to Production (GHCR + DigitalOcean)

on:
  push:
    branches:
      - main

# Los despliegues no se cancelan a mitad (podría quedar el Droplet con imágenes
# a medio actualizar): un push nuevo espera a que termine el anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # subir imágenes a GHCR
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: pdf-extract
            context: services/pdf-extract
            file: services/pdf-extract/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR exige minúsculas y github.repository puede traer mayúsculas (FLOTUZ/automed).
      - name: Set lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}" >> "$GITHUB_ENV"

      # El build (pnpm install/build, prisma generate) ocurre dentro de cada Dockerfile.
      # La configuración de runtime (DATABASE_URL, JWT_SECRET, claves…) vive en el .env
      # del Droplet; GitHub Actions no la ve.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      # Dokku acepta comandos por SSH con el usuario `dokku` (clave autorizada con
      # `dokku ssh-keys:add`). El login a GHCR ya quedó guardado en el servidor (bootstrap.sh).
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DOKKU_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host dokku
            HostName ${{ secrets.DOKKU_HOST }}
            User dokku
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG

      # Orden: pdf-extract y api primero (api migra la BD al arrancar), web al final.
      # Dokku hace despliegue sin caída: si el contenedor nuevo no arranca, deja el anterior.
      - name: Deploy images with Dokku
        run: |
          PREFIX="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          for app in pdf-extract api web; do
            echo "== $app =="
            ssh dokku "git:from-image $app $PREFIX-$app:${{ github.sha }}"
          done

      - name: Check the site is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.APP_DOMAIN }}/api/health" | grep -q '"status":"ok"'; then
              echo "OK"; exit 0
            fi
            echo "esperando ($i/30)..."; sleep 10
          done
          echo "El sitio no respondió sano tras el despliegue" >&2
          exit 1
