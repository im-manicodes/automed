name: Build image and deploy (GHCR + Dokku)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Un push nuevo a la misma rama cancela la construcción anterior que siga corriendo.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # subir la imagen a GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR exige minúsculas y github.repository puede traer mayúsculas (FLOTUZ/automed).
      - name: Set lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Imagen única (Dockerfile de la raíz): API + front compilado + pdf-extract.
      # La configuración de runtime (DATABASE_URL, JWT_SECRET, claves…) la pone el servidor
      # al arrancar el contenedor; GitHub Actions no la ve.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Solo corre cuando defines la variable de repositorio DEPLOY_ENABLED=true (Settings -> Variables),
  # es decir, cuando ya tienes el servidor Dokku preparado. Mientras tanto solo se publica la imagen.
  deploy:
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # El despliegue en curso NO se cancela (el servidor podría quedar a medio actualizar): si llega
    # otro, espera su turno y, de haber varios en cola, solo corre el más reciente.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      # Dokku acepta comandos por SSH con el usuario `dokku` (clave autorizada con
      # `dokku ssh-keys:add`). El login a GHCR ya quedó guardado en el servidor (bootstrap.sh).
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DOKKU_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host dokku
            HostName ${{ secrets.DOKKU_HOST }}
            User dokku
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG

      # Despliegue sin caída: si el contenedor nuevo no arranca, Dokku deja el anterior.
      # La imagen migra la base de datos al arrancar.
      - name: Deploy image with Dokku
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          ssh dokku "git:from-image automed $IMAGE:${{ github.sha }}"

      - name: Check the site is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.APP_DOMAIN }}/api/health" | grep -q '"status":"ok"'; then
              echo "OK"; exit 0
            fi
            echo "esperando ($i/30)..."; sleep 10
          done
          echo "El sitio no respondió sano tras el despliegue" >&2
          exit 1
