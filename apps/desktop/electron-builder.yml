appId: com.automed.app
productName: auto-med
copyright: auto-med
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
# Sin asar: Postgres embebido necesita ejecutar binarios y enlaces simbolicos reales en disco.
asar: false
# Los recursos (api/, web/, ocr-local/, build-config.json) se copian en `resources/` con scripts/after-pack.cjs:
# electron-builder excluye siempre las carpetas node_modules de extraResources.
afterPack: scripts/after-pack.cjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: auto-med
  category: Office
  maintainer: auto-med <emmanuel.seoonup@gmail.com>
  synopsis: Resumenes de correos médicos con IA
  description: auto-med sincroniza tu correo de Outlook, lee los PDF y genera resumenes. Todo se guarda en tu equipo.
deb:
  packageName: auto-med
  packageCategory: utils
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
