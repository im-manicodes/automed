# Hot reload para desarrollo. NO se carga solo: actívalo en tu .env raíz (gitignored) con
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
# y luego `docker compose up` (sin --build para cada cambio de código; --build solo al cambiar dependencias).
# Producción usa SOLO docker-compose.yml (imágenes de build, nginx en :8080). En dev: http://localhost:5173.
# Requiere Docker Compose >= 2.24 (etiqueta !override).
services:
  api:
    image: auto-med-api-dev   # no pisa la imagen de producción del compose base
    build:
      dockerfile: apps/api/Dockerfile.dev
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && pnpm --filter api dev"]
    environment:
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:5173
      COOKIE_SECURE: ""
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
      - ./apps/api/tsconfig.json:/repo/apps/api/tsconfig.json:ro
      - ./apps/api/tsconfig.build.json:/repo/apps/api/tsconfig.build.json:ro
      - ./apps/api/nest-cli.json:/repo/apps/api/nest-cli.json:ro
      - ./apps/api/prisma.config.ts:/repo/apps/api/prisma.config.ts:ro
      # Cliente Prisma generado (ignorado en git): vive en un volumen, así el bind mount de src no lo
      # oculta y no se crean archivos de root en tu carpeta. Se regenera en cada arranque.
      - api-prisma-client:/repo/apps/api/src/generated
    healthcheck:
      start_period: 120s   # prisma generate + migrate + primera compilación

  pdf-extract:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/srv/app"]
    volumes:
      - ./services/pdf-extract/app:/srv/app

  web:
    image: auto-med-web-dev
    build:
      dockerfile: apps/web/Dockerfile.dev
    ports: !override
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:3000
      # Pon CHOKIDAR_USEPOLLING=true en tu .env solo si el hot reload no detecta cambios.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-}
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/public:/repo/apps/web/public
      - ./apps/web/index.html:/repo/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/repo/apps/web/vite.config.ts:ro
      - ./apps/web/vitest.config.ts:/repo/apps/web/vitest.config.ts:ro
      - ./apps/web/tsconfig.json:/repo/apps/web/tsconfig.json:ro
      - ./apps/web/tsconfig.app.json:/repo/apps/web/tsconfig.app.json:ro
      - ./apps/web/tsconfig.node.json:/repo/apps/web/tsconfig.node.json:ro

volumes:
  api-prisma-client:
