services:
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfsdata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env (ver .env.example)}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-automed}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: http://localhost:8080
      OCR_LOCAL_URL: http://ocr-local:8000
      PDF_EXTRACT_URL: http://pdf-extract:8001
      # Con Ollama (elegido en la web), dentro de Docker el servicio se llama `ollama` (no localhost).
      OLLAMA_BASE_URL: http://ollama:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rustfs:
        condition: service_started
    healthcheck:
      # /api/health no requiere sesión; devuelve 200 aunque BD/RustFS estén caídos (revisa el cuerpo: status/db/storage).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # PDF digital -> markdown con PyMuPDF (sin OCR). Sin perfil: siempre activo, es ligero. `api` no depende de
  # él: si no responde, la API cae al OCR completo (degradación segura). PyMuPDF es AGPL-3.0 (ver docs/despliegue.md).
  pdf-extract:
    build: ./services/pdf-extract
    environment:
      PDF_TEXT_MIN_CHARS: ${PDF_TEXT_MIN_CHARS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8001:8001"

  # OCR local en CPU, solo desarrollo. Perfil `local`: no corre salvo que lo actives explícitamente
  # (`--profile local` o COMPOSE_PROFILES=local en .env). Luego elige OCR «local» en la web (Ajustes -> OCR)
  # con URL http://ocr-local:8000. `api` no depende de él (así Textract no lo necesita).
  ocr-local:
    profiles: ["local"]
    build: ./services/ocr-local
    environment:
      OCR_LOCAL_ENGINE: ${OCR_LOCAL_ENGINE:-paddle}
      OCR_LANG: ${OCR_LANG:-es}
    volumes:
      - ocrmodels:/models
    ports:
      - "127.0.0.1:8000:8000"

  # LLM local con GPU NVIDIA, SOLO desarrollo/pruebas (producción: bedrock). Perfil `ollama`,
  # activación explícita (`--profile ollama` o COMPOSE_PROFILES=ollama); luego elige Ollama en la web con
  # URL http://ollama:11434/v1. El contenido no sale de la máquina.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      # El contexto por defecto de Ollama (4096) truncaría las síntesis; SYNTH_MAX_INPUT_TOKENS debe ser menor.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollamamodels:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # One-shot: descarga el/los modelos cuando ollama está sano y termina.
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL_TEXT: ${LLM_MODEL_TEXT:-qwen3-vl:4b-instruct}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$$LLM_MODEL_TEXT"
        if [ -n "$$LLM_MODEL_VISION" ] && [ "$$LLM_MODEL_VISION" != "$$LLM_MODEL_TEXT" ]; then ollama pull "$$LLM_MODEL_VISION"; fi
    restart: "no"

  # Relay de «Usar desde el celular» (apps/relay): servicio OPCIONAL, solo perfil `relay` (no corre con
  # `docker compose up` normal; actívalo con `--profile relay` o COMPOSE_PROFILES=relay). Sin BD: guarda solo devices.json en
  # RELAY_DATA_DIR (volumen relaydata). Sirve solo el arranque (apps/relay/bootstrap), no el front. Escucha en 127.0.0.1: pon delante un proxy con HTTPS (docs/despliegue.md).
  relay:
    profiles: ["relay"]
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    environment:
      PORT: "8080"
      RELAY_DATA_DIR: /data
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-1}
      RELAY_COOKIE_SECURE: ${RELAY_COOKIE_SECURE:-1}
      RELAY_REGISTRATION_TOKEN: ${RELAY_REGISTRATION_TOKEN:-}
    volumes:
      - relaydata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${RELAY_PORT:-8081}:8080"

volumes:
  relaydata:
  rustfsdata:
  ocrmodels:
  ollamamodels:
