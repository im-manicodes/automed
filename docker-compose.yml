services:
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfsdata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define DATABASE_URL_DOCKER en .env (ver .env.example)}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-automed}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: http://localhost:8080
      OCR_LOCAL_URL: http://ocr-local:8000
      # Con LLM_PROVIDER=ollama, dentro de Docker el servicio se llama `ollama` (no localhost).
      OLLAMA_BASE_URL: http://ollama:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rustfs:
        condition: service_started
    healthcheck:
      # /api/health no requiere sesión; devuelve 200 aunque BD/RustFS estén caídos (revisa el cuerpo: status/db/storage).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # OCR local en CPU, solo desarrollo. Se activa solo con OCR_ENGINE=local: el .env raíz define
  # COMPOSE_PROFILES=${OCR_ENGINE},${LLM_PROVIDER} y este servicio pertenece al perfil `local`.
  # Con OCR_ENGINE=textract no corre. `api` no depende de él (así textract no lo necesita).
  ocr-local:
    profiles: ["local"]
    build: ./services/ocr-local
    environment:
      OCR_LOCAL_ENGINE: ${OCR_LOCAL_ENGINE:-paddle}
      OCR_LANG: ${OCR_LANG:-es}
    volumes:
      - ocrmodels:/models
    ports:
      - "127.0.0.1:8000:8000"

  # LLM local con GPU NVIDIA, SOLO desarrollo/pruebas (producción: bedrock). Perfil `ollama`,
  # activo con LLM_PROVIDER=ollama (vía COMPOSE_PROFILES). El contenido no sale de la máquina.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      # El contexto por defecto de Ollama (4096) truncaría las síntesis; SYNTH_MAX_INPUT_TOKENS debe ser menor.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollamamodels:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # One-shot: descarga el/los modelos cuando ollama está sano y termina.
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL_TEXT: ${LLM_MODEL_TEXT:-qwen2.5vl:3b}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$$LLM_MODEL_TEXT"
        if [ -n "$$LLM_MODEL_VISION" ] && [ "$$LLM_MODEL_VISION" != "$$LLM_MODEL_TEXT" ]; then ollama pull "$$LLM_MODEL_VISION"; fi
    restart: "no"

volumes:
  rustfsdata:
  ocrmodels:
  ollamamodels:
